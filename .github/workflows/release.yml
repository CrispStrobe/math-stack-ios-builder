---
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release XCFrameworks
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf autoconf-archive automake libtool cmake ninja

      - name: Build all
        run: bash build_all.sh

      - name: Package XCFrameworks
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for fw in ./*.xcframework; do
            if [ -d "$fw" ]; then
              NAME=$(basename "$fw" .xcframework)
              tar czf "${NAME}-${VERSION}.xcframework.tar.gz" "$fw"
              echo "Packaged: ${NAME}-${VERSION}.xcframework.tar.gz"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.xcframework.tar.gz'
          body: |
            ## Math Stack iOS Builder ${{ github.ref_name }}

            ### XCFrameworks
            Pre-built XCFrameworks for iOS (arm64), iOS Simulator (arm64, x86_64), and macOS (arm64, x86_64).

            Download the `.tar.gz` archives and extract into your project.

            ### Library Versions
            - GMP 6.3.0
            - MPFR 4.2.2
            - MPC 1.3.1
            - FLINT 3.3.1
            - SymEngine 0.11.2
